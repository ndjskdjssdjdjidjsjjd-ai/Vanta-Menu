name: Build Vanta Menu

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [Android64, Win64, MacOS]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod for ${{ matrix.platform }}
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.platform }}

      - name: Upload built .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantaMenu-${{ matrix.platform }}
          path: ${{ steps.build.outputs.build-output }}
          
