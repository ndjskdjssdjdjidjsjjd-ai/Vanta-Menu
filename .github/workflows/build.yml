name: Build Vanta Menu

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod for Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload built .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: VantaMenu-Android64
          path: ${{ steps.build.outputs.build-output }}
          
